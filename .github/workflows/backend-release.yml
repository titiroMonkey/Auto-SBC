name: Backend EXE Release

on:
  push:
    branches:
      - eafc27
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        env:
          VERSION_BASE_COMMIT: 2958cf255a326ad34001c6b696cf79b1b995c726
        run: |
          git merge-base --is-ancestor "$VERSION_BASE_COMMIT" "$GITHUB_SHA"
          REVISION=$(git rev-list --first-parent --count "$VERSION_BASE_COMMIT..$GITHUB_SHA")
          if [[ "$REVISION" -lt 1 ]]; then
            echo "Release commits must follow the version baseline."
            exit 1
          fi
          echo "tag=v27.$REVISION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show versions
        run: |
          python --version
          pip list

      - name: Test backend and updater
        run: python -m unittest discover -s backend -p "test_*.py"

      - name: Embed release version
        shell: python
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          import os
          from pathlib import Path

          Path("backend/release-version.txt").write_text(os.environ["RELEASE_VERSION"], encoding="utf-8")

      - name: Build EXE
        shell: cmd
        run: |
          if exist dist rd /s /q dist
          if exist build rd /s /q build
          pyinstaller --noconfirm --onefile --name AutoSBCBackend ^
            --paths backend ^
            --hidden-import main ^
            --add-data "backend\release-version.txt;." ^
            --add-data "backend\update-helper.ps1;." ^
            --collect-all ortools ^
            backend\main.py
          if not exist dist\AutoSBCBackend.exe (
            echo Build failed: EXE missing
            dir dist
            exit /b 1
          )

      - name: Smoke test EXE
        shell: python
        env:
          AUTOSBC_DISABLE_UPDATES: "1"
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          version = subprocess.check_output(["dist/AutoSBCBackend.exe", "--version"], text=True, timeout=30).strip()
          assert version == os.environ["RELEASE_VERSION"], f"Unexpected EXE version: {version}"
          process = subprocess.Popen(["dist/AutoSBCBackend.exe"])
          try:
              deadline = time.monotonic() + 90
              while time.monotonic() < deadline:
                if process.poll() is not None:
                  raise RuntimeError("Backend exited before becoming ready")
                try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/openapi.json", timeout=2) as response:
                    schema = json.load(response)
                  assert "paths" in schema, "Backend did not return an OpenAPI schema"
                  break
                except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
              else:
                raise RuntimeError("Backend did not become ready within 90 seconds")
          finally:
              subprocess.run(["taskkill", "/PID", str(process.pid), "/T", "/F"], check=False)
              process.wait(timeout=10)

      - name: Compute checksum
        id: sums
        shell: bash
        run: |
          echo "sha256=$(sha256sum dist/AutoSBCBackend.exe | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSBCBackend-${{ steps.version.outputs.tag }}
          path: dist/AutoSBCBackend.exe
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoSBC Backend ${{ steps.version.outputs.tag }}
          body: |
            AutoSBC Backend release ${{ steps.version.outputs.tag }}
            Commit: ${{ github.sha }}
            SHA256: `${{ steps.sums.outputs.sha256 }}`
            Notes:
            - Built via PyInstaller.
            - Run: AutoSBCBackend.exe (binds to port 8000).
            - Checks for newer releases at startup and asks before downloading and restarting.
            - Set AUTOSBC_ENABLE_FILE_LOGS=1 to enable file logging in packaged mode.
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/AutoSBCBackend.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
